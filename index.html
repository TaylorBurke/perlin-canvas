<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ember Field — perlin-canvas demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="field"></canvas>

<div class="label">
  <h1>Ember Field</h1>
  <p>Generative lamp grid &mdash; <span>ember</span> / <em>jade</em></p>
</div>

<div class="panel" id="panel">
  <div class="panel-row">
    <label for="preset">Palette</label>
    <select id="preset">
      <option value="ember" selected>Ember / Jade</option>
      <option value="cobalt">Cobalt / Orchid</option>
      <option value="rose">Rose / Gold</option>
    </select>
  </div>
  <div class="panel-row">
    <label for="cellSize">Cell size</label>
    <input id="cellSize" type="range" min="6" max="20" step="1" value="11">
  </div>
  <div class="panel-row">
    <label for="speed">Pacing</label>
    <input id="speed" type="range" min="0.2" max="3" step="0.1" value="1">
  </div>
  <div class="panel-row">
    <label for="density">Density</label>
    <input id="density" type="range" min="0.4" max="1.6" step="0.05" value="1">
  </div>
</div>

<script src="main.js"></script>
<script>
  var PRESETS = {
    ember: ['#ff5a1f', '#ff9a2e', '#f4c430', '#b5d93c', '#6fcf52', '#2fb88a', '#1e8a6e'],
    cobalt: ['#0a1eff', '#1450ff', '#0082ff', '#5a3cff', '#8c3cff', '#b950ff', '#dc6eff'],
    rose: ['#ff2f6e', '#ff6a5e', '#ff9d4d', '#ffc24d', '#ffe08a', '#f7f3d0']
  };

  var field = PerlinCanvas.mount(document.getElementById('field'), {
    hues: PRESETS.ember,
    cellSize: 11,
    speed: 1,
    density: 1
  });

  var presetEl = document.getElementById('preset');
  var cellSizeEl = document.getElementById('cellSize');
  var speedEl = document.getElementById('speed');
  var densityEl = document.getElementById('density');

  presetEl.addEventListener('input', function () {
    field.setOptions({ hues: PRESETS[presetEl.value] });
  });
  cellSizeEl.addEventListener('input', function () {
    field.setOptions({ cellSize: Number(cellSizeEl.value) });
  });
  speedEl.addEventListener('input', function () {
    field.setOptions({ speed: Number(speedEl.value) });
  });
  densityEl.addEventListener('input', function () {
    field.setOptions({ density: Number(densityEl.value) });
  });
</script>
</body>
</html>
